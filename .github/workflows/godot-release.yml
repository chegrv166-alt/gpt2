name: Godot desktop release

on:
  push:
    branches: [main]
    tags: ['v0.7.*']
    paths:
      - 'godot/**'
      - '.github/workflows/godot-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate pinned engine and templates
        id: paths
        run: python godot/tools/ci_release.py paths --directory "${{ runner.temp }}/godot-runtime"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.paths.outputs.engine }}
            ${{ steps.paths.outputs.templates }}
          key: godot-4.6.3-verified-v1-${{ runner.os }}
      - name: Install official Godot and verify SHA512
        run: python godot/tools/ci_release.py bootstrap --directory "${{ runner.temp }}/godot-runtime"
      - name: Import and run model, scene and playthrough suites
        run: python godot/tools/ci_release.py check
      - name: Export native release with embedded resources
        run: python godot/tools/ci_release.py build
      - name: Launch actual packaged application on target OS
        run: python godot/tools/ci_release.py smoke
      - name: Package executable, instructions and licenses
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python -c 'import re,pathlib; print(re.search(r"config/version=\"([^\"]+)\"", pathlib.Path("godot/project.godot").read_text(encoding="utf-8")).group(1))')"
          fi
          python godot/tools/ci_release.py package --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-${{ matrix.platform }}
          path: release-godot/*
          if-no-files-found: error
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-validation-${{ matrix.platform }}
          path: godot/build/validation/*
          if-no-files-found: ignore

  publish:
    name: Publish verified Godot release
    if: startsWith(github.ref, 'refs/tags/v0.7.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Godot-*
          path: downloaded-artifacts
      - name: Collect player downloads and checksums
        shell: bash
        run: |
          mkdir -p release-godot
          find downloaded-artifacts -type f \( -name 'Ashen-Covenant-*.zip' -o -name 'Ashen-Covenant-*.tar.gz' \) -exec cp '{}' release-godot/ \;
          cd release-godot
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish downloadable native builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-godot/* --verify-tag --latest --title "Ashen Covenant $GITHUB_REF_NAME · Godot" --notes-file godot/release-notes.md
